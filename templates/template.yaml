AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EFS DR Readiness Monitoring Dashboard — Deploys Lambda functions, EventBridge schedule,
  and IAM role for monitoring EFS replication health. Deploy this template in BOTH regions
  (source and destination) with appropriate parameters.

Parameters:
  SourceFileSystemId:
    Type: String
    Description: EFS filesystem ID in the source region (e.g., fs-0abc1234def56789a)
    AllowedPattern: 'fs-[0-9a-f]+'

  DestFileSystemId:
    Type: String
    Description: >
      EFS filesystem ID in the destination region (e.g., fs-0def6789abc1234ef). Accepted for
      parity with the dashboard stack, which does reference it, and so that both deployments are
      driven by one consistent set of values. No resource in THIS stack reads it: the replication
      monitor and orchestrator discover the current destination at runtime from
      DescribeReplicationConfigurations, which is what lets the solution follow a reversal in
      replication direction without being redeployed.
    AllowedPattern: 'fs-[0-9a-f]+'

  SourceRegion:
    Type: String
    Description: AWS Region of the source EFS filesystem (e.g., us-east-1)

  DestRegion:
    Type: String
    Description: AWS Region of the destination EFS filesystem (e.g., us-west-2)

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      VPC containing this region's EFS mount targets. Typed as AWS::EC2::VPC::Id so CloudFormation
      rejects a non-existent VPC at submission time, and to record which VPC the subnets and
      security group below belong to. No resource references it directly. The Lambda network
      configuration is built from SubnetIds and EfsSecurityGroupId.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets with EFS mount target access (select at least one)

  EfsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group that allows NFS traffic (port 2049) to EFS mount targets

  EfsAccessPointArn:
    Type: String
    Description: >
      EFS Access Point ARN for Lambda to mount the LOCAL filesystem in this region.
      Create an access point with PosixUser Uid=0, Gid=0 and RootDirectory Path=/.
    AllowedPattern: 'arn:aws:elasticfilesystem:[a-z0-9-]+:[0-9]+:access-point/fsap-[0-9a-f]+'

  LocalFileSystemArn:
    Type: String
    Description: ARN of the EFS filesystem in THIS region (used for Lambda mount)
    AllowedPattern: 'arn:aws:elasticfilesystem:[a-z0-9-]+:[0-9]+:file-system/fs-[0-9a-f]+'

  ScheduleInterval:
    Type: String
    Default: 'rate(5 minutes)'
    Description: How often to run the monitoring checks

  DeployOrchestrator:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Deploy the orchestrator and replication monitor in this stack.
      Set to 'true' in ONE region only (typically the source region).
      Set to 'false' in the other region (only file monitor + validator are needed there).

  ResourceSuffix:
    Type: String
    Default: ''
    MaxLength: 20
    AllowedPattern: '[a-zA-Z0-9-]*'
    Description: >
      Optional suffix appended to Lambda function, log group, IAM role, and
      EventBridge rule names. Leave empty for the default names. Set it (for example
      '-test') if those names are already taken in your account, or to run a second
      copy of the stack alongside an existing one. Use the SAME value in both regions
      and in the dashboard stack, otherwise cross-region invocation and the dashboard
      log queries will not resolve.

Conditions:
  IsOrchestratorRegion: !Equals [!Ref DeployOrchestrator, 'true']

Resources:

  # ============================================================
  # IAM Role — shared by all Lambda functions in this stack
  # ============================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'dr-efs-monitor-role-${AWS::Region}${ResourceSuffix}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: dr-efs-monitor-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EFSDescribe
                Effect: Allow
                Action:
                  - elasticfilesystem:DescribeFileSystems
                  - elasticfilesystem:DescribeReplicationConfigurations
                  - elasticfilesystem:DescribeMountTargets
                Resource: '*'
              # ClientMount alone grants read access; ClientWrite is deliberately
              # omitted so the functions can never modify the filesystem they inspect.
              # ClientRootAccess is required because the access point maps to Uid/Gid 0.
              - Sid: EFSClientAccess
                Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientRootAccess
                Resource:
                  - !Ref LocalFileSystemArn
              - Sid: CloudWatchMetrics
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: 'DR/EFSMonitor'
              - Sid: BackupList
                Effect: Allow
                Action:
                  - backup:ListRecoveryPointsByResource
                Resource: '*'
              - Sid: CrossRegionLambdaInvoke
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub 'arn:aws:lambda:${SourceRegion}:${AWS::AccountId}:function:dr-file-monitor-source${ResourceSuffix}'
                  - !Sub 'arn:aws:lambda:${SourceRegion}:${AWS::AccountId}:function:dr-file-validator-dest${ResourceSuffix}'
                  - !Sub 'arn:aws:lambda:${DestRegion}:${AWS::AccountId}:function:dr-file-monitor-source${ResourceSuffix}'
                  - !Sub 'arn:aws:lambda:${DestRegion}:${AWS::AccountId}:function:dr-file-validator-dest${ResourceSuffix}'

  # ============================================================
  # Lambda: File Monitor (Source) — deployed in BOTH regions
  # Mounts local EFS, finds last modified file, computes checksum
  # ============================================================
  FileMonitorSourceFunction:
    Type: AWS::Lambda::Function
    DependsOn: FileMonitorLogGroup
    Properties:
      FunctionName: !Sub 'dr-file-monitor-source${ResourceSuffix}'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 120
      MemorySize: 256
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref EfsSecurityGroupId
      FileSystemConfigs:
        - Arn: !Ref EfsAccessPointArn
          LocalMountPath: /mnt/efs
      Code:
        ZipFile: |
          import os, hashlib, json, time

          EFS_MOUNT = '/mnt/efs'

          def handler(event, context):
              latest_file, latest_mtime = None, 0
              total_files, total_size = 0, 0

              for root, _, files in os.walk(EFS_MOUNT):
                  for f in files:
                      path = os.path.join(root, f)
                      try:
                          stat = os.stat(path)
                          total_files += 1
                          total_size += stat.st_size
                          if stat.st_mtime > latest_mtime:
                              latest_mtime, latest_file = stat.st_mtime, path
                      except OSError:
                          continue

              checksum, file_size = None, 0
              if latest_file:
                  file_size = os.path.getsize(latest_file)
                  h = hashlib.sha256()
                  with open(latest_file, 'rb') as fh:
                      for chunk in iter(lambda: fh.read(8192), b''):
                          h.update(chunk)
                  checksum = h.hexdigest()

              rel_path = latest_file.replace(EFS_MOUNT, '') if latest_file else 'N/A'
              age = time.time() - latest_mtime if latest_mtime else -1

              result = {
                  'role': 'source',
                  'last_modified_file': rel_path,
                  'last_modified_time': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime(latest_mtime)) if latest_mtime else 'N/A',
                  'file_size_bytes': file_size,
                  'checksum_sha256': checksum,
                  'total_files': total_files,
                  'total_size_bytes': total_size,
                  'last_modified_file_age': age,
              }
              print(json.dumps(result))
              return result

  # ============================================================
  # Lambda: File Validator (Destination) — deployed in BOTH regions
  # Mounts local EFS, validates file existence and checksum
  # ============================================================
  FileValidatorDestFunction:
    Type: AWS::Lambda::Function
    DependsOn: FileValidatorLogGroup
    Properties:
      FunctionName: !Sub 'dr-file-validator-dest${ResourceSuffix}'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 120
      MemorySize: 256
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref EfsSecurityGroupId
      FileSystemConfigs:
        - Arn: !Ref EfsAccessPointArn
          LocalMountPath: /mnt/efs
      Code:
        ZipFile: |
          import os, hashlib, json

          EFS_MOUNT = '/mnt/efs'

          def handler(event, context):
              rel_path = event.get('last_modified_file', '')
              source_checksum = event.get('checksum_sha256')
              source_size = event.get('file_size_bytes', 0)

              dest_path = EFS_MOUNT + rel_path
              exists = os.path.exists(dest_path)

              dest_checksum, dest_size = None, 0
              if exists:
                  dest_size = os.path.getsize(dest_path)
                  h = hashlib.sha256()
                  with open(dest_path, 'rb') as fh:
                      for chunk in iter(lambda: fh.read(8192), b''):
                          h.update(chunk)
                  dest_checksum = h.hexdigest()

              checksum_match = (dest_checksum == source_checksum) if source_checksum and dest_checksum else False

              total_files, total_size = 0, 0
              for root, _, files in os.walk(EFS_MOUNT):
                  for f in files:
                      total_files += 1
                      try:
                          total_size += os.path.getsize(os.path.join(root, f))
                      except OSError:
                          continue

              result = {
                  'role': 'destination',
                  'file': rel_path,
                  'exists': exists,
                  'source_checksum': source_checksum,
                  'dest_checksum': dest_checksum,
                  'checksum_match': checksum_match,
                  'dest_file_size': dest_size,
                  'source_file_size': source_size,
                  'total_files': total_files,
                  'total_size_bytes': total_size,
              }
              print(json.dumps(result))
              return result

  # ============================================================
  # Lambda: Replication Monitor — deployed in orchestrator region ONLY
  # Queries EFS APIs, publishes replication health metrics
  # ============================================================
  ReplicationMonitorFunction:
    Type: AWS::Lambda::Function
    Condition: IsOrchestratorRegion
    DependsOn: ReplicationMonitorLogGroup
    Properties:
      FunctionName: !Sub 'dr-replication-monitor${ResourceSuffix}'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          SOURCE_FS_ID: !Ref SourceFileSystemId
          SOURCE_REGION: !Ref SourceRegion
          DEST_REGION: !Ref DestRegion
          ACCOUNT_ID: !Ref AWS::AccountId
      Code:
        ZipFile: |
          import boto3, json, time, os
          from botocore.exceptions import ClientError

          NS = 'DR/EFSMonitor'
          FS_ID = os.environ['SOURCE_FS_ID']
          R1 = os.environ['SOURCE_REGION']
          R2 = os.environ['DEST_REGION']
          ACCT = os.environ['ACCOUNT_ID']

          def handler(event, context):
              efs = boto3.client('efs', region_name=R1)
              try:
                  repl = efs.describe_replication_configurations(FileSystemId=FS_ID)['Replications'][0]
              except ClientError as e:
                  if e.response['Error']['Code'] != 'ReplicationNotFound':
                      raise
                  # No replication configuration exists — e.g. it was deleted during a
                  # failover, or SOURCE_FS_ID is wrong. Publish ERROR (-3) so the dashboard
                  # shows a red signal instead of silently going stale, and log a row that
                  # the Replication Configuration widget can display (it filters on source_fs).
                  boto3.client('cloudwatch', region_name=R1).put_metric_data(Namespace=NS, MetricData=[
                      {'MetricName': 'ReplicationStatus', 'Value': -3, 'Unit': 'None'},
                      {'MetricName': 'SyncAgeSeconds', 'Value': -1, 'Unit': 'Seconds'},
                  ])
                  log = {
                      'source_fs': f'{FS_ID} (no replication configuration)', 'source_region': R1,
                      'source_dns': '-', 'source_ips': '-', 'source_permission': '-',
                      'dest_fs': '-', 'dest_region': '-', 'dest_dns': '-', 'dest_ips': '-',
                      'dest_permission': '-', 'replication_status': 'NOT_CONFIGURED',
                      'status_message': f'No replication configuration found for {FS_ID}. '
                                        'It may have been deleted, or SOURCE_FS_ID may be incorrect.',
                      'last_sync': 'N/A', 'source_backups': [], 'dest_backups': [],
                  }
                  print(json.dumps(log))
                  return log

              src_fs = repl['SourceFileSystemId']
              src_r = repl['SourceFileSystemRegion']
              dst_fs = repl['Destinations'][0]['FileSystemId']
              dst_r = repl['Destinations'][0]['Region']
              status = repl['Destinations'][0]['Status']
              status_message = repl['Destinations'][0].get('StatusMessage', '')
              last_sync = repl['Destinations'][0].get('LastReplicatedTimestamp')
              sync_age = (time.time() - last_sync.timestamp()) if last_sync else -1

              efs_s = boto3.client('efs', region_name=src_r)
              efs_d = boto3.client('efs', region_name=dst_r)
              s_info = efs_s.describe_file_systems(FileSystemId=src_fs)['FileSystems'][0]
              d_info = efs_d.describe_file_systems(FileSystemId=dst_fs)['FileSystems'][0]
              s_size = s_info['SizeInBytes']['Value']
              # Destination is ~12 MiB larger due to EFS replication metadata.
              # Subtract to normalize size comparison. Observed in testing — may vary.
              d_size = max(d_info['SizeInBytes']['Value'] - 12582912, 0)

              s_mts = efs_s.describe_mount_targets(FileSystemId=src_fs)['MountTargets']
              d_mts = efs_d.describe_mount_targets(FileSystemId=dst_fs)['MountTargets']

              backups = {}
              for lbl, rgn, fs in [('source', src_r, src_fs), ('dest', dst_r, dst_fs)]:
                  bk = boto3.client('backup', region_name=rgn)
                  arn = f'arn:aws:elasticfilesystem:{rgn}:{ACCT}:file-system/{fs}'
                  try:
                      rps = bk.list_recovery_points_by_resource(ResourceArn=arn, MaxResults=3).get('RecoveryPoints', [])
                  except Exception:
                      rps = []
                  # Recovery point ARNs are colon-delimited (…:recovery-point:UUID),
                  # so split on ':' to get the short ID for the dashboard widget.
                  backups[lbl] = [{'id': r['RecoveryPointArn'].split(':')[-1], 'created': str(r['CreationDate']), 'status': r['Status']} for r in rps]

              cw = boto3.client('cloudwatch', region_name=R1)
              sv = {'ENABLED': 2, 'ENABLING': 1, 'PAUSING': 0,
                    'PAUSED': -1, 'DELETING': -2, 'ERROR': -3}.get(status, -3)
              cw.put_metric_data(Namespace=NS, MetricData=[
                  {'MetricName': 'ReplicationStatus', 'Value': sv, 'Unit': 'None'},
                  {'MetricName': 'SyncAgeSeconds', 'Value': sync_age, 'Unit': 'Seconds'},
                  {'MetricName': 'SourceSizeGB', 'Value': s_size/1073741824, 'Unit': 'Gigabytes'},
                  {'MetricName': 'DestSizeGB', 'Value': d_size/1073741824, 'Unit': 'Gigabytes'},
                  {'MetricName': 'SizeDiffPercent', 'Value': abs(s_size-d_size)/max(s_size,1)*100, 'Unit': 'Percent'},
                  {'MetricName': 'SourceBackupCount', 'Value': len(backups['source']), 'Unit': 'Count'},
                  {'MetricName': 'DestBackupCount', 'Value': len(backups['dest']), 'Unit': 'Count'},
              ])

              dst_perm = 'Read-Only' if status in ('ENABLED','ENABLING') else 'Read/Write'
              log = {
                  'source_fs': f"{s_info.get('Name',src_fs)} ({src_fs})", 'source_region': src_r,
                  'source_dns': f'{src_fs}.efs.{src_r}.amazonaws.com',
                  'source_ips': ', '.join(m['IpAddress'] for m in s_mts), 'source_permission': 'Read/Write',
                  'dest_fs': f"{d_info.get('Name',dst_fs)} ({dst_fs})", 'dest_region': dst_r,
                  'dest_dns': f'{dst_fs}.efs.{dst_r}.amazonaws.com',
                  'dest_ips': ', '.join(m['IpAddress'] for m in d_mts), 'dest_permission': dst_perm,
                  'replication_status': status, 'status_message': status_message or '-',
                  'last_sync': str(last_sync) if last_sync else 'N/A',
                  'source_backups': backups['source'], 'dest_backups': backups['dest'],
              }
              print(json.dumps(log))
              return log

  # ============================================================
  # Lambda: File Orchestrator — deployed in orchestrator region ONLY
  # Detects replication direction, invokes monitor + validator
  # ============================================================
  FileOrchestratorFunction:
    Type: AWS::Lambda::Function
    Condition: IsOrchestratorRegion
    DependsOn: FileOrchestratorLogGroup
    Properties:
      FunctionName: !Sub 'dr-file-orchestrator${ResourceSuffix}'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 600
      MemorySize: 128
      ReservedConcurrentExecutions: 1  # Prevent overlapping invocations on large filesystems
      Environment:
        Variables:
          SOURCE_FS_ID: !Ref SourceFileSystemId
          SOURCE_REGION: !Ref SourceRegion
          DEST_REGION: !Ref DestRegion
          MONITOR_FN: !Sub 'dr-file-monitor-source${ResourceSuffix}'
          VALIDATOR_FN: !Sub 'dr-file-validator-dest${ResourceSuffix}'
      Code:
        ZipFile: |
          import boto3, json, os
          from botocore.exceptions import ClientError

          NAMESPACE = 'DR/EFSMonitor'
          FS_ID = os.environ['SOURCE_FS_ID']
          REGION_1 = os.environ['SOURCE_REGION']
          REGION_2 = os.environ['DEST_REGION']
          MONITOR_FN = os.environ['MONITOR_FN']
          VALIDATOR_FN = os.environ['VALIDATOR_FN']

          def handler(event, context):
              efs = boto3.client('efs', region_name=REGION_1)
              try:
                  repl = efs.describe_replication_configurations(FileSystemId=FS_ID)['Replications'][0]
              except ClientError as e:
                  if e.response['Error']['Code'] != 'ReplicationNotFound':
                      raise
                  # Without a replication configuration there is no direction to detect,
                  # so skip the file checks rather than fail. The replication monitor
                  # publishes ReplicationStatus = -3, which surfaces this on the dashboard.
                  out = {'error': 'no_replication_configuration', 'file_system_id': FS_ID,
                         'detail': 'Replication is not configured; skipping file validation.'}
                  print(json.dumps(out))
                  return out

              src_region = repl['SourceFileSystemRegion']
              dst_region = repl['Destinations'][0]['Region']

              # --- Source file monitor ---
              src_result = {}
              try:
                  src_lambda = boto3.client('lambda', region_name=src_region)
                  src_resp = src_lambda.invoke(FunctionName=MONITOR_FN, Payload='{}')
                  src_result = json.loads(src_resp['Payload'].read())
                  if 'errorMessage' in src_result:
                      print(json.dumps({'error': 'source_monitor_failed', 'detail': src_result}))
                      src_result = {'total_files': 0, 'total_size_bytes': 0, 'last_modified_file_age': -1}
              except Exception as e:
                  print(json.dumps({'error': 'source_monitor_exception', 'detail': str(e)}))
                  src_result = {'total_files': 0, 'total_size_bytes': 0, 'last_modified_file_age': -1}

              # --- Destination file monitor (fire-and-forget for logging) ---
              # InvocationType='Event' keeps this off the critical path. Its output is only
              # read from CloudWatch Logs by the dashboard, never by this function, and a
              # synchronous call would block while the destination re-reads and checksums
              # the newest file — time that scales with file size.
              dst_lambda = boto3.client('lambda', region_name=dst_region)
              try:
                  dst_lambda.invoke(FunctionName=MONITOR_FN, InvocationType='Event', Payload='{}')
              except Exception as e:
                  print(json.dumps({'error': 'dest_monitor_exception', 'detail': str(e)}))

              # --- Destination file validator ---
              dst_result = {}
              try:
                  dst_resp = dst_lambda.invoke(FunctionName=VALIDATOR_FN, Payload=json.dumps(src_result))
                  dst_result = json.loads(dst_resp['Payload'].read())
                  if 'errorMessage' in dst_result:
                      print(json.dumps({'error': 'dest_validator_failed', 'detail': dst_result}))
                      dst_result = {'exists': False, 'checksum_match': False, 'total_files': 0, 'total_size_bytes': 0}
              except Exception as e:
                  print(json.dumps({'error': 'dest_validator_exception', 'detail': str(e)}))
                  dst_result = {'exists': False, 'checksum_match': False, 'total_files': 0, 'total_size_bytes': 0}

              # --- Publish source metrics ---
              if isinstance(src_result, dict):
                  boto3.client('cloudwatch', region_name=src_region).put_metric_data(Namespace=NAMESPACE, MetricData=[
                      {'MetricName': 'LastModifiedFileAge', 'Value': src_result.get('last_modified_file_age', -1), 'Unit': 'Seconds'},
                      {'MetricName': 'SourceFileCount', 'Value': src_result.get('total_files', 0), 'Unit': 'Count'},
                      {'MetricName': 'SourceTotalSizeMB', 'Value': src_result.get('total_size_bytes', 0) / (1024*1024), 'Unit': 'Megabytes'},
                  ])

              # --- Publish destination metrics ---
              if isinstance(dst_result, dict):
                  boto3.client('cloudwatch', region_name=dst_region).put_metric_data(Namespace=NAMESPACE, MetricData=[
                      {'MetricName': 'FileExistsOnDest', 'Value': 1 if dst_result.get('exists') else 0, 'Unit': 'None'},
                      {'MetricName': 'ChecksumMatch', 'Value': 1 if dst_result.get('checksum_match') else 0, 'Unit': 'None'},
                      {'MetricName': 'DestFileCount', 'Value': dst_result.get('total_files', 0), 'Unit': 'Count'},
                      {'MetricName': 'DestTotalSizeMB', 'Value': dst_result.get('total_size_bytes', 0) / (1024*1024), 'Unit': 'Megabytes'},
                  ])

              output = {'source': src_result, 'destination': dst_result}
              print(json.dumps(output))
              return output

  # ============================================================
  # EventBridge Schedule — orchestrator region only
  # ============================================================
  MonitorScheduleRule:
    Type: AWS::Events::Rule
    Condition: IsOrchestratorRegion
    Properties:
      Name: !Sub 'dr-efs-monitor-schedule${ResourceSuffix}'
      ScheduleExpression: !Ref ScheduleInterval
      State: ENABLED
      Targets:
        - Id: replication-monitor
          Arn: !GetAtt ReplicationMonitorFunction.Arn
        - Id: file-orchestrator
          Arn: !GetAtt FileOrchestratorFunction.Arn

  ReplicationMonitorInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: IsOrchestratorRegion
    Properties:
      FunctionName: !Ref ReplicationMonitorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonitorScheduleRule.Arn

  FileOrchestratorInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: IsOrchestratorRegion
    Properties:
      FunctionName: !Ref FileOrchestratorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonitorScheduleRule.Arn

  # ============================================================
  # CloudWatch Log Groups
  # ============================================================
  FileMonitorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/dr-file-monitor-source${ResourceSuffix}'
      RetentionInDays: 14

  FileValidatorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/dr-file-validator-dest${ResourceSuffix}'
      RetentionInDays: 14

  ReplicationMonitorLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsOrchestratorRegion
    Properties:
      LogGroupName: !Sub '/aws/lambda/dr-replication-monitor${ResourceSuffix}'
      RetentionInDays: 14

  FileOrchestratorLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsOrchestratorRegion
    Properties:
      LogGroupName: !Sub '/aws/lambda/dr-file-orchestrator${ResourceSuffix}'
      RetentionInDays: 14

Outputs:
  FileMonitorFunctionArn:
    Description: ARN of the file monitor Lambda (needed for cross-region invocation)
    Value: !GetAtt FileMonitorSourceFunction.Arn

  FileValidatorFunctionArn:
    Description: ARN of the file validator Lambda (needed for cross-region invocation)
    Value: !GetAtt FileValidatorDestFunction.Arn

  ReplicationMonitorFunctionArn:
    Condition: IsOrchestratorRegion
    Description: ARN of the replication monitor Lambda
    Value: !GetAtt ReplicationMonitorFunction.Arn

  LambdaRoleArn:
    Description: IAM role ARN used by all Lambda functions
    Value: !GetAtt LambdaExecutionRole.Arn
